version: 2
updates:
  # Actualizar dependencias de npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Agrupar actualizaciones menores
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "patch"
    labels:
      - "dependencies"
      - "automated"
    # Configuración específica para Node.js
    versioning-strategy: auto
    # Principio 14: los majors de TypeScript se revisan a mano.
    # @angular/build fija un rango de peer (p. ej. >=6.0 <6.1); typescript@7 rompió npm install.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  
  # Actualizar GitHub Actions también
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"