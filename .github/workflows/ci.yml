name: CI

# Principio 12 de la constitución: un PR solo se mergea con build + test en verde.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  # Auditoría semanal de master: detecta vulnerabilidades publicadas aunque no haya cambios.
  # Un run fallido avisa por email al propietario (según sus ajustes de notificaciones).
  schedule:
    - cron: '0 7 * * 1' # lunes 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Solo se cancelan runs antiguos de un PR; cada push a master conserva su run completo.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Principio 5: código formateado con Prettier.
      - name: Format check
        run: npm run format:check

      # Principio 5: angular-eslint sin errores.
      - name: Lint
        run: npx ng lint

      - name: Build (production)
        run: npx ng build

      - name: Unit tests
        run: npx ng test --watch=false

      # Principio 16: sin vulnerabilidades high/critical en dependencias de producción.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
